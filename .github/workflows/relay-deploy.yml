# Lust's party relay (lust/relay): the Cloudflare worker Lust users share skins through
# (launcher/lust_share.py). Needs the CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers")
# and CLOUDFLARE_ACCOUNT_ID secrets; builds find its address the same way.
name: Deploy party relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lust/relay/**", ".github/workflows/relay-deploy.yml"]

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Deploy
        working-directory: lust/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first"
            exit 1
          fi
          npm ci
          npx wrangler deploy
      - name: Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python lust/relay/write_config.py
          url=$(python -c "exec(open('party/network/relay_config.py').read()); print(RELAY_URL.replace('wss://', 'https://'))")
          sleep 10
          curl -fsS "$url/"
          pip install --quiet websockets
          python lust/relay/check_rooms.py
